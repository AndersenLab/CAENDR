{% extends "_layouts/default.html" %}


{% block style %}
<style>
  .releases-list {
    padding-left: 1em;
    padding-right: 0.5em;
    margin-bottom: 0;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
  }
  .releases-list li {
    display: block;
    text-indent: -0.5em;
    margin-left: 0.5em;
    padding-bottom: 0.25em;
  }
</style>
{% endblock %}


{% block content %}
<!-- <div class="row">
  <div class="col-md-9"></div>
  <div class="col-md-3">
    <a id='create' href="{{ url_for('admin_gene_browser_tracks.create_gene_browser_tracks')}}" class="btn btn-primary btn-block"><span class="glyphicon glyphicon-plus" aria-hidden="true"></span> New Gene Browser Track Version </a>
  </div>
</div> -->

<div class="container">
  <div class="col mt-5">
    <div class="table-responsive">
      <table id="table-browser-tracks" class="table p-0 text-center w-100">
        <caption class="visually-hidden">A list of genome browser tracks.</caption>
        <thead class="table-secondary align-middle">
          <tr>
            <th scope="col" class="col-1 text-center">Order</th>
            <th scope="col" class="col-1 text-center">Order</th>
            <th scope="col" class="col-1 text-center">Display Name</th>
            <th scope="col" class="col-1 text-center">Filename</th>
            <th scope="col" class="col-1 text-center">Availability in Genome Browser</th>
            <th scope="col" class="col-1 text-center">Checked by Default?</th>
          </tr>
        </thead>
        <tbody class="table-group-divider align-middle"></tbody>
      </table>
    </div>
  </div>
</div>


{% endblock %}



{% block script %}
<script>
  {% include '_scripts/utils.js' %}       {#/* defines: flash_message */#}


  // Declare data table at "global" scope
  let table;


  $(document).ready(function() {

    $.ajaxSetup({
      beforeSend: function(xhr, settings) {
        if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type) && !this.crossDomain) {
          xhr.setRequestHeader("X-CSRFToken", "{{ form.csrf_token._value() }}")
        }
      }
    });

    // Render table with Datatables
    table = $('#table-browser-tracks').DataTable( {
      "sDom": "tpr",
      "processing": true,
      "ajax": {
        url: "{{ url_for('api_tracks.query_datatables') }}",

        // On error, flash message
        error: function(error) {
          console.error('ERROR retrieving browser tracks: ', error);
          const resp = error.responseJSON
          if (resp && resp.message) {
            flash_message(resp.message, resp.full_msg_link, resp.full_msg_body);
          } else {
            flash_message('There was a problem retrieving the list of browser tracks. Please try again later.');
          }
        },
      },
      "autoWidth": false,
      "rowId": function(data) {
        return `browser-tracks-row-${data.name}`;
      },
      "rowReorder": {
        "dataSrc": "order",
      },
      "columnDefs": [
        { "targets": "_all", "orderable": false }
      ],
      "columns": [

        // Drag & drop reordering
        {
          "data": "order",
          "visible": false,
          "orderable": true,
        },
        {
          "data": "order",
          "render": function(data, type, row) {
            return `<i class="bi bi-arrows-expand" aria-hidden="true"></i>`;
          },
          "sClass": "optionsToolbar reorderColumn text-center",
          "sWidth": "8%",
        },

        {
          "data": "display_name",
          "sClass": "optionsToolbar text-start",
          "width": '24%',
        },

        {
          "data": "filename",
          "sClass": "optionsToolbar text-start font-monospace small",
          "width": '35%',
        },

        {
          "data": "available_releases",
          "render": function(data, type, row) {

            // Map the available releases to HTML list entries
            const elements = data.map(release => {
              const icon = release.available
                ? '<i class="bi bi-check-circle-fill" aria-hidden="true"></i>'
                : '<i class="bi bi-x-circle text-dark" aria-hidden="true"></i>';

              return `<li>${ icon } <em>${ release.species }</em></li>`
            });

            // Render as a single list
            return '<ul class="releases-list text-start">' + elements.join('') + '</ul>'
          },
          "sClass": "optionsToolbar",
          "width": '15%',
        },

        {
          "data": "checked",
          "render": function(data, type, row) {
            return data ? `<i class="bi bi-check-circle-fill" aria-hidden="true"></i>` : "";
          },
          "sClass": "optionsToolbar text-center",
          "sWidth": "8%",
        },
      ]
    });

  });
</script>
{% endblock %}
